# BE（Go）用 CI の最小例。CI が無い場合は .github/workflows/ci-api.yml にコピーして使う。
# name: は factory-heal.yml の workflows: と一致させること。
# コードがまだ無い（go.mod が無い）間は何もせず緑で終わる（グリーンフィールド対応）。
name: CI / api
on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/ci-api.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "backend"
    steps:
      - uses: actions/checkout@v4
      - id: code
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::backend/go.mod が無いため CI をスキップ（雛形が入ると有効になる）"; fi
      - if: steps.code.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.sum"
      - if: steps.code.outputs.present == 'true'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # 生成パイプライン（scripts/generate.sh）が入るまではスキップ
      - if: steps.code.outputs.present == 'true' && hashFiles('scripts/generate.sh') != ''
        name: generated code is up to date
        run: bash ../scripts/generate.sh be && git diff --exit-code
      - if: steps.code.outputs.present == 'true'
        run: go vet ./...
      - if: steps.code.outputs.present == 'true'
        run: go build ./...
      - if: steps.code.outputs.present == 'true'
        run: go test ./... -count=1 -race
