# FE 用 CI の最小例。CI が無い場合は .github/workflows/ci-web.yml にコピーして使う。
# name: は factory-heal.yml の workflows: と一致させること。
# コードがまだ無い（package.json が無い）間は何もせず緑で終わる（グリーンフィールド対応）。
name: CI / web
on:
  pull_request:
    paths: ["frontend/**", "contracts/**", ".github/workflows/ci-web.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - uses: actions/checkout@v4
      - id: code
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/package.json が無いため CI をスキップ（雛形が入ると有効になる）"; fi
      - if: steps.code.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
      - if: steps.code.outputs.present == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - if: steps.code.outputs.present == 'true'
        run: pnpm typecheck && pnpm lint
      - if: steps.code.outputs.present == 'true'
        run: pnpm test -- --ci
      - if: steps.code.outputs.present == 'true'
        run: pnpm build
