# factory / labels ワークフローが同期する（EndBug/label-sync）。
# Issue テンプレートは存在しないラベルを付けられないので、最初に一度このワークフローを実行すること。

# --- 状態（常にちょうど1つ） ---
- name: "factory:triage"
  color: "c5def5"
  description: "受付済み。AIが分類・重複確認・完全性チェック中"
- name: "factory:needs-info"
  color: "fbca04"
  description: "AIが質問を投稿。人間の返答待ち"
- name: "factory:planned"
  color: "bfd4f2"
  description: "AIが仕様・計画・リスク・予算を提案済み。人間の承認待ち"
- name: "factory:ready"
  color: "0e8a16"
  description: "人間が意図を承認。buildが起動する（唯一のGoシグナル）"
- name: "factory:building"
  color: "1d76db"
  description: "エージェントが実装中"
- name: "factory:in-review"
  color: "5319e7"
  description: "Draft PRあり。人間のレビュー・マージ待ち"
- name: "factory:blocked"
  color: "b60205"
  description: "人間の判断が必要（理由はコメント参照）"
- name: "factory:done"
  color: "0e8a16"
  description: "マージ済み"

# --- 種別 ---
- name: "type:bug"
  color: "d73a4a"
  description: "不具合"
- name: "type:feature"
  color: "a2eeef"
  description: "機能追加・変更"
- name: "type:docs"
  color: "0075ca"
  description: "ドキュメント"
- name: "type:chore"
  color: "cfd3d7"
  description: "依存更新・リファクタ・CI などの雑務"

# --- リスク ---
- name: "risk:low"
  color: "c2e0c6"
  description: "docs/テスト/内部リファクタ。レビューは軽く"
- name: "risk:medium"
  color: "fef2c0"
  description: "既存機能の変更。通常レビュー"
- name: "risk:high"
  color: "f9d0c4"
  description: "認証/決済/DBマイグレーション/公開API/インフラ。人間2名レビュー"

# --- 予算 ---
- name: "budget:s"
  color: "ededed"
  description: "小: 1〜2ファイル、--max-turns 40"
- name: "budget:m"
  color: "d4c5f9"
  description: "中: 1モジュール、--max-turns 80"
- name: "budget:l"
  color: "e99695"
  description: "大: 複数モジュール、--max-turns 150"

# --- PR 側: CI 自動修復の試行回数 ---
- name: "heal:1"
  color: "fbca04"
  description: "CI自動修復 1回目"
- name: "heal:2"
  color: "f9a825"
  description: "CI自動修復 2回目（上限）"

# --- 領域（モノレポ）: intake が判定、人間が上書き可 ---
- name: "area:fe"
  color: "c5f5e8"
  description: "フロントエンド"
- name: "area:be"
  color: "c5d5f5"
  description: "バックエンド"
- name: "area:fullstack"
  color: "e8c5f5"
  description: "FE/BE 両方。契約 → BE → FE の順で進める（分割推奨）"
- name: "area:infra"
  color: "f5e3c5"
  description: "CI / IaC / 契約 / ルート設定"
