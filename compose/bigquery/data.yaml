# BigQuery エミュレータ（ghcr.io/goccy/bigquery-emulator）の初期データ。
# ローカル用のデータセットとテーブルを作る。backend はテーブルを作らない。
# 列の定義は本番の Terraform と合わせる正（README の「BigQuery のテーブル」も参照）。
projects:
  - id: abdoc-local
    datasets:
      - id: abdoc
        tables:
          - id: engagement_events
            columns:
              - { name: slug, type: STRING, mode: REQUIRED }
              - { name: variant, type: STRING, mode: REQUIRED }
              - { name: visitor_id, type: STRING, mode: REQUIRED }
              - { name: max_scroll_depth, type: INT64, mode: REQUIRED }
              - { name: duration_seconds, type: FLOAT64, mode: REQUIRED }
              - { name: timestamp, type: TIMESTAMP, mode: REQUIRED }
          - id: reaction_events
            columns:
              - { name: slug, type: STRING, mode: REQUIRED }
              - { name: variant, type: STRING, mode: REQUIRED }
              - { name: visitor_id, type: STRING, mode: REQUIRED }
              - { name: reaction, type: STRING, mode: REQUIRED }
              - { name: previous_reaction, type: STRING, mode: REQUIRED }
              - { name: timestamp, type: TIMESTAMP, mode: REQUIRED }
